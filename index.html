<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI CAME">
<title>AI CAME</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #camera-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  video.back{transform:scaleX(1)}
  #ui-layer{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px 16px 32px;z-index:10}
  .top-bar{display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
  .top-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
  .top-btn:active{background:rgba(255,255,255,0.35)}
  .bottom-bar{display:flex;justify-content:center;align-items:center;gap:40px;pointer-events:auto}
  .capture-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer}
  .capture-btn::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
  .capture-btn:active{transform:scale(0.92)}
  .capture-btn.recording::after{background:#ff3b30}
  .capture-btn.recording{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.5)}50%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
  .side-btn{background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
  #gallery-strip{position:fixed;bottom:120px;left:0;right:0;display:flex;gap:8px;padding:0 16px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;z-index:9}
  #gallery-strip::-webkit-scrollbar{display:none}
  .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;cursor:pointer;background:#222}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity 0.1s}
  #install-banner{position:fixed;top:0;left:0;right:0;background:#1c1c1e;color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:200;font-size:14px;border-bottom:1px solid #333}
  #install-banner.show{display:flex}
  #install-btn{background:#fff;color:#000;border:none;padding:6px 16px;border-radius:20px;font-weight:500;cursor:pointer;font-size:13px}
  #dismiss-install{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer}
  #mode-switch{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border-radius:20px;overflow:hidden;pointer-events:auto;z-index:10}
  .mode-btn{padding:6px 18px;border:none;background:transparent;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
  .mode-btn.active{background:rgba(255,255,255,0.25)}
  #timer-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:500;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,0.5);opacity:0;pointer-events:none;z-index:50;transition:opacity 0.2s}
  #timer-display.show{opacity:1}
  #filter-bar{position:fixed;top:120px;left:0;right:0;display:flex;gap:6px;padding:0 12px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;z-index:11}
  #filter-bar::-webkit-scrollbar{display:none}
  .filter-btn{padding:6px 14px;border:none;border-radius:16px;background:rgba(255,255,255,0.12);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
  .filter-btn.active{background:#fff;color:#000;font-weight:500}
</style>
</head>
<body>
<div id="flash"></div>
<div id="install-banner">
  <span>📸 ثبّت "AI CAME" على شاشتك الرئيسية</span>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="install-btn">تثبيت</button>
    <button id="dismiss-install">&times;</button>
  </div>
</div>
<div id="camera-container"><video id="video" autoplay playsinline muted></video></div>
<div id="filter-bar">
  <button class="filter-btn active" data-filter="none">🎨 أصلي</button>
  <button class="filter-btn" data-filter="grayscale">⚫ أبيض/أسود</button>
  <button class="filter-btn" data-filter="sepia">🟤 سبيا</button>
  <button class="filter-btn" data-filter="vintage">📀 فينتاج</button>
  <button class="filter-btn" data-filter="bright">☀️ ساطع</button>
  <button class="filter-btn" data-filter="contrast">⚡ تباين</button>
  <button class="filter-btn" data-filter="blur">💨 ضبابي</button>
</div>
<div id="ui-layer">
  <div class="top-bar">
    <button class="top-btn" id="btn-flash">⚡</button>
    <div id="mode-switch">
      <button class="mode-btn active" data-mode="photo">صورة</button>
      <button class="mode-btn" data-mode="video">فيديو</button>
    </div>
    <button class="top-btn" id="btn-timer">⏱️</button>
  </div>
  <div id="gallery-strip"></div>
  <div class="bottom-bar">
    <button class="side-btn" id="btn-gallery">🖼️</button>
    <button class="capture-btn" id="btn-capture"></button>
    <button class="side-btn" id="btn-switch">🔄</button>
  </div>
</div>
<script>
var video=document.getElementById("video");
var btnCapture=document.getElementById("btn-capture");
var btnSwitch=document.getElementById("btn-switch");
var btnFlash=document.getElementById("btn-flash");
var btnTimer=document.getElementById("btn-timer");
var galleryStrip=document.getElementById("gallery-strip");
var flashEl=document.getElementById("flash");
var installBanner=document.getElementById("install-banner");
var installBtn=document.getElementById("install-btn");
var dismissInstall=document.getElementById("dismiss-install");
var modeBtns=document.querySelectorAll(".mode-btn");
var filterBtns=document.querySelectorAll(".filter-btn");
var timerDisplay=document.createElement("div");
timerDisplay.id="timer-display";
document.body.appendChild(timerDisplay);

var currentStream=null;
var facingMode="user";
var flashOn=false;
var timerSec=0;
var timerOptions=[0,3,5,10];
var mode="photo";
var mediaRecorder=null;
var recordedChunks=[];
var isRecording=false;
var gallery=JSON.parse(localStorage.getItem("camGallery")||"[]");
var currentFilter="none";

function startCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(function(t){t.stop()});
  }
  var constraints={
    video:{facingMode:facingMode,width:{ideal:1920},height:{ideal:1080}},
    audio:mode==="video"
  };
  navigator.mediaDevices.getUserMedia(constraints).then(function(stream){
    currentStream=stream;
    video.srcObject=stream;
    if(facingMode==="environment"){video.classList.add("back");}else{video.classList.remove("back");}
    var track=stream.getVideoTracks()[0];
    var caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch){track.applyConstraints({advanced:[{torch:flashOn}]});}
  }).catch(function(err){
    alert("مش قادر أفتح الكاميرا: "+err.message);
  });
}

btnSwitch.addEventListener("click",function(){
  facingMode=facingMode==="user"?"environment":"user";
  startCamera();
});

btnFlash.addEventListener("click",function(){
  flashOn=!flashOn;
  btnFlash.style.opacity=flashOn?"1":"0.5";
  if(currentStream){
    var track=currentStream.getVideoTracks()[0];
    var caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.torch){track.applyConstraints({advanced:[{torch:flashOn}]});}
  }
});

modeBtns.forEach(function(b){
  b.addEventListener("click",function(){
    mode=b.dataset.mode;
    modeBtns.forEach(function(x){x.classList.toggle("active",x===b)});
    if(isRecording)stopRecord();
    startCamera();
  });
});

filterBtns.forEach(function(b){
  b.addEventListener("click",function(){
    currentFilter=b.dataset.filter;
    filterBtns.forEach(function(x){x.classList.toggle("active",x===b)});
    applyFilterToVideo();
  });
});

function applyFilterToVideo(){
  var f="none";
  switch(currentFilter){
    case "grayscale":f="grayscale(100%)";break;
    case "sepia":f="sepia(100%)";break;
    case "vintage":f="sepia(60%) contrast(1.2) brightness(0.9) saturate(1.3)";break;
    case "bright":f="brightness(1.4) contrast(1.1)";break;
    case "contrast":f="contrast(1.8) saturate(1.2)";break;
    case "blur":f="blur(3px) brightness(1.1)";break;
  }
  video.style.filter=f;
}

btnTimer.addEventListener("click",function(){
  var idx=timerOptions.indexOf(timerSec);
  timerSec=timerOptions[(idx+1)%timerOptions.length];
  btnTimer.textContent=timerSec?timerSec+"s":"⏱️";
});

function runTimer(sec){
  return new Promise(function(resolve){
    if(!sec){resolve();return}
    var left=sec;
    timerDisplay.textContent=left;
    timerDisplay.classList.add("show");
    var iv=setInterval(function(){
      left--;
      timerDisplay.textContent=left;
      if(left<=0){clearInterval(iv);timerDisplay.classList.remove("show");resolve();}
    },1000);
  });
}

function applyCanvasFilter(ctx,w,h){
  if(currentFilter==="none")return;
  var imgData=ctx.getImageData(0,0,w,h);
  var data=imgData.data;
  for(var i=0;i<data.length;i+=4){
    var r=data[i],g=data[i+1],b=data[i+2];
    if(currentFilter==="grayscale"){
      var avg=0.299*r+0.587*g+0.114*b;
      data[i]=avg;data[i+1]=avg;data[i+2]=avg;
    }else if(currentFilter==="sepia"||currentFilter==="vintage"){
      var tr=0.393*r+0.769*g+0.189*b;
      var tg=0.349*r+0.686*g+0.168*b;
      var tb=0.272*r+0.534*g+0.131*b;
      data[i]=tr>255?255:tr;data[i+1]=tg>255?255:tg;data[i+2]=tb>255?255:tb;
      if(currentFilter==="vintage"){data[i]*=0.9;data[i+1]*=0.85;data[i+2]*=0.8;}
    }else if(currentFilter==="bright"){
      data[i]=Math.min(255,r*1.4);data[i+1]=Math.min(255,g*1.4);data[i+2]=Math.min(255,b*1.4);
    }else if(currentFilter==="contrast"){
      var factor=1.8;
      data[i]=Math.min(255,((r/255-0.5)*factor+0.5)*255);
      data[i+1]=Math.min(255,((g/255-0.5)*factor+0.5)*255);
      data[i+2]=Math.min(255,((b/255-0.5)*factor+0.5)*255);
    }
  }
  ctx.putImageData(imgData,0,0);
}

function drawWatermark(ctx,w,h){
  ctx.save();
  ctx.font="bold "+Math.max(16,Math.floor(w/25))+"px Arial";
  ctx.fillStyle="rgba(255,255,255,0.7)";
  ctx.textAlign="right";
  ctx.shadowColor="rgba(0,0,0,0.5)";
  ctx.shadowBlur=4;
  ctx.fillText("AI CAME - Helmy",w-20,h-20);
  ctx.restore();
}

btnCapture.addEventListener("click",function(){
  if(mode==="photo"){
    runTimer(timerSec).then(function(){
      flashEl.style.opacity="1";
      setTimeout(function(){flashEl.style.opacity="0"},100);
      var canvas=document.createElement("canvas");
      var vw=video.videoWidth||640;
      var vh=video.videoHeight||480;
      canvas.width=vw;
      canvas.height=vh;
      var ctx=canvas.getContext("2d");
      if(facingMode==="user"){ctx.translate(vw,0);ctx.scale(-1,1);}
      ctx.drawImage(video,0,0,vw,vh);
      if(facingMode==="user"){ctx.setTransform(1,0,0,1,0,0);}
      applyCanvasFilter(ctx,vw,vh);
      drawWatermark(ctx,vw,vh);
      var dataUrl=canvas.toDataURL("image/jpeg",0.92);
      saveToGallery(dataUrl,"image");
    });
  }else{
    if(!isRecording){runTimer(timerSec).then(function(){startRecord()});}else{stopRecord();}
  }
});

function startRecord(){
  recordedChunks=[];
  mediaRecorder=new MediaRecorder(currentStream,{mimeType:"video/webm"});
  mediaRecorder.ondataavailable=function(e){if(e.data.size)recordedChunks.push(e.data);};
  mediaRecorder.onstop=function(){
    var blob=new Blob(recordedChunks,{type:"video/webm"});
    saveToGallery(URL.createObjectURL(blob),"video");
  };
  mediaRecorder.start();
  isRecording=true;
  btnCapture.classList.add("recording");
}
function stopRecord(){
  if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();
  isRecording=false;
  btnCapture.classList.remove("recording");
}

function saveToGallery(url,type){
  gallery.unshift({url:url,type:type,date:Date.now()});
  if(gallery.length>50)gallery=gallery.slice(0,50);
  localStorage.setItem("camGallery",JSON.stringify(gallery));
  renderGallery();
}

function renderGallery(){
  galleryStrip.innerHTML="";
  gallery.slice(0,10).forEach(function(item){
    var el=document.createElement(item.type==="video"?"video":"img");
    el.className="thumb";el.src=item.url;
    if(item.type==="video"){el.muted=true;el.playsInline=true;}
    el.addEventListener("click",function(){
      var full=document.createElement("div");
      full.style.cssText="position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;";
      var media=document.createElement(item.type==="video"?"video":"img");
      media.src=item.url;media.style.maxWidth="100%";media.style.maxHeight="80%";
      if(item.type==="video"){media.controls=true;media.autoplay=true;}
      full.appendChild(media);
      if(item.type==="image"){
        var saveBtn=document.createElement("button");
        saveBtn.textContent="💾 حفظ في Gallery";
        saveBtn.style.cssText="margin-top:16px;padding:12px 24px;background:#fff;color:#000;border:none;border-radius:24px;font-size:16px;font-weight:500;cursor:pointer;";
        saveBtn.onclick=function(){
          var a=document.createElement("a");
          a.href=item.url;
          a.download="AI_CAME_Helmy_"+Date.now()+".jpg";
          a.click();
        };
        full.appendChild(saveBtn);
      }
      var close=document.createElement("button");
      close.textContent="✕";
      close.style.cssText="position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.5);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;";
      close.onclick=function(){full.remove();};
      full.appendChild(close);
      document.body.appendChild(full);
    });
    galleryStrip.appendChild(el);
  });
}
renderGallery();

var deferredPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();deferredPrompt=e;installBanner.classList.add("show");
});
installBtn.addEventListener("click",function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(choice){
    if(choice.outcome==="accepted")installBanner.classList.remove("show");
    deferredPrompt=null;
  });
});
dismissInstall.addEventListener("click",function(){installBanner.classList.remove("show");});

startCamera();
document.addEventListener("visibilitychange",function(){if(!document.hidden)startCamera();});
</script>
</body>
</html>
