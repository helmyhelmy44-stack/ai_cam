<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI CAME">
<title>AI CAME</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  #camera-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  video.back{transform:scaleX(1)}
  #ui-layer{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px 16px 32px;z-index:10}
  .top-bar{display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
  .top-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(8px);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
  .top-btn:active{background:rgba(255,255,255,0.35)}
  .bottom-bar{display:flex;justify-content:center;align-items:center;gap:40px;pointer-events:auto}
  .capture-btn{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;position:relative;cursor:pointer}
  .capture-btn::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
  .capture-btn:active{transform:scale(0.92)}
  .capture-btn.recording::after{background:#ff3b30}
  .capture-btn.recording{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.5)}50%{box-shadow:0 0 0 12px rgba(255,59,48,0)}}
  .side-btn{background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:none;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
  #gallery-strip{position:fixed;bottom:120px;left:0;right:0;display:flex;gap:8px;padding:0 16px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;z-index:9}
  #gallery-strip::-webkit-scrollbar{display:none}
  .thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;cursor:pointer;background:#222}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity 0.1s}
  #install-banner{position:fixed;top:0;left:0;right:0;background:#1c1c1e;color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:200;font-size:14px;border-bottom:1px solid #333}
  #install-banner.show{display:flex}
  #install-btn{background:#fff;color:#000;border:none;padding:6px 16px;border-radius:20px;font-weight:500;cursor:pointer;font-size:13px}
  #dismiss-install{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer}
  #mode-switch{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border-radius:20px;overflow:hidden;pointer-events:auto;z-index:10}
  .mode-btn{padding:6px 18px;border:none;background:transparent;color:#fff;font-size:13px;cursor:pointer;font-weight:500}
  .mode-btn.active{background:rgba(255,255,255,0.25)}
  #timer-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;font-weight:500;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,0.5);opacity:0;pointer-events:none;z-index:50;transition:opacity 0.2s}
  #timer-display.show{opacity:1}
</style>
</head>
<body>
<div id="flash"></div>
<div id="install-banner">
  <span>📸 ثبّت "AI CAME" على شاشتك الرئيسية</span>
  <div style="display:flex;align-items:center;gap:8px">
    <button id="install-btn">تثبيت</button>
    <button id="dismiss-install">&times;</button>
  </div>
</div>
<div id="camera-container"><video id="video" autoplay playsinline muted></video></div>
<div id="ui-layer">
  <div class="top-bar">
    <button class="top-btn" id="btn-flash">⚡</button>
    <div id="mode-switch">
      <button class="mode-btn active" data-mode="photo">صورة</button>
      <button class="mode-btn" data-mode="video">فيديو</button>
    </div>
    <button class="top-btn" id="btn-timer">⏱️</button>
  </div>
  <div id="gallery-strip"></div>
  <div class="bottom-bar">
    <button class="side-btn" id="btn-gallery">🖼️</button>
    <button class="capture-btn" id="btn-capture"></button>
    <button class="side-btn" id="btn-switch">🔄</button>
  </div>
</div>
<script>
// ====== INLINE MANIFEST (PWA) ======
const manifestObj={name:"AI CAME",short_name:"AI CAME",start_url:".",display:"standalone",background_color:"#0a1628",theme_color:"#0a1628",orientation:"portrait"};
const manifestBlob=new Blob([JSON.stringify(manifestObj)],{type:"application/json"});
const manifestURL=URL.createObjectURL(manifestBlob);
const link=document.createElement("link");link.rel="manifest";link.href=manifestURL;document.head.appendChild(link);

// ====== INLINE SERVICE WORKER ======
const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))});`;
const swBlob=new Blob([swCode],{type:"application/javascript"});
const swURL=URL.createObjectURL(swBlob);
if("serviceWorker"in navigator)navigator.serviceWorker.register(swURL).catch(()=>{});

// ====== CAMERA APP ======
const video=document.getElementById("video"),btnCapture=document.getElementById("btn-capture"),btnSwitch=document.getElementById("btn-switch"),btnFlash=document.getElementById("btn-flash"),btnTimer=document.getElementById("btn-timer"),galleryStrip=document.getElementById("gallery-strip"),flashEl=document.getElementById("flash"),installBanner=document.getElementById("install-banner"),installBtn=document.getElementById("install-btn"),dismissInstall=document.getElementById("dismiss-install"),modeBtns=document.querySelectorAll(".mode-btn"),timerDisplay=document.createElement("div");timerDisplay.id="timer-display";document.body.appendChild(timerDisplay);
let currentStream=null,facingMode="user",flashOn=false,timerSec=0,timerOptions=[0,3,5,10],mode="photo",mediaRecorder=null,recordedChunks=[],isRecording=false,gallery=JSON.parse(localStorage.getItem("camGallery")||"[]");

async function startCamera(){if(currentStream){currentStream.getTracks().forEach(t=>t.stop())}try{const c={video:{facingMode,width:{ideal:1920},height:{ideal:1080}},audio:mode==="video"};currentStream=await navigator.mediaDevices.getUserMedia(c);video.srcObject=currentStream;video.classList.toggle("back",facingMode==="environment");const track=currentStream.getVideoTracks()[0];const caps=track.getCapabilities();if(caps.torch)track.applyConstraints({advanced:[{torch:flashOn}]})}catch(err){alert("مش قادر أفتح الكاميرا: "+err.message)}}

btnSwitch.addEventListener("click",()=>{facingMode=facingMode==="user"?"environment":"user";startCamera()});
btnFlash.addEventListener("click",()=>{flashOn=!flashOn;btnFlash.style.opacity=flashOn?"1":"0.5";const track=currentStream?.getVideoTracks()[0];if(track){const caps=track.getCapabilities();if(caps.torch)track.applyConstraints({advanced:[{torch:flashOn}]})}});
modeBtns.forEach(b=>{b.addEventListener("click",()=>{mode=b.dataset.mode;modeBtns.forEach(x=>x.classList.toggle("active",x===b));if(isRecording)stopRecord();startCamera()})});
btnTimer.addEventListener("click",()=>{const idx=timerOptions.indexOf(timerSec);timerSec=timerOptions[(idx+1)%timerOptions.length];btnTimer.textContent=timerSec?timerSec+"s":"⏱️"});
function runTimer(sec){return new Promise(resolve=>{if(!sec){resolve();return}let left=sec;timerDisplay.textContent=left;timerDisplay.classList.add("show");const iv=setInterval(()=>{left--;timerDisplay.textContent=left;if(left<=0){clearInterval(iv);timerDisplay.classList.remove("show");resolve()}},1000)})}

btnCapture.addEventListener("click",async()=>{if(mode==="photo"){await runTimer(timerSec);flashEl.style.opacity="1";setTimeout(()=>flashEl.style.opacity="0",100);const c=document.createElement("canvas");c.width=video.videoWidth;c.height=video.videoHeight;const x=c.getContext("2d");if(facingMode==="user"){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(video,0,0);saveToGallery(c.toDataURL("image/jpeg",0.92),"image")}else{if(!isRecording){await runTimer(timerSec);startRecord()}else{stopRecord()}}});

function startRecord(){recordedChunks=[];mediaRecorder=new MediaRecorder(currentStream,{mimeType:"video/webm"});mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};mediaRecorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:"video/webm"});saveToGallery(URL.createObjectURL(blob),"video")};mediaRecorder.start();isRecording=true;btnCapture.classList.add("recording")}
function stopRecord(){if(mediaRecorder&&mediaRecorder.state!=="inactive")mediaRecorder.stop();isRecording=false;btnCapture.classList.remove("recording")}
function saveToGallery(url,type){gallery.unshift({url,type,date:Date.now()});if(gallery.length>50)gallery=gallery.slice(0,50);localStorage.setItem("camGallery",JSON.stringify(gallery));renderGallery()}
function renderGallery(){galleryStrip.innerHTML="";gallery.slice(0,10).forEach(item=>{const el=document.createElement(item.type==="video"?"video":"img");el.className="thumb";el.src=item.url;if(item.type==="video"){el.muted=true;el.playsInline=true}el.addEventListener("click",()=>{const full=document.createElement("div");full.style.cssText="position:fixed;inset:0;background:#000;z-index:300;display:flex;align-items:center;justify-content:center;";const media=document.createElement(item.type==="video"?"video":"img");media.src=item.url;media.style.maxWidth="100%";media.style.maxHeight="100%";if(item.type==="video"){media.controls=true;media.autoplay=true}full.appendChild(media);const close=document.createElement("button");close.textContent="✕";close.style.cssText="position:absolute;top:16px;right:16px;background:rgba(0,0,0,0.5);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;";close.onclick=()=>full.remove();full.appendChild(close);document.body.appendChild(full)});galleryStrip.appendChild(el)})}
renderGallery();

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installBanner.classList.add("show")});
installBtn.addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;if(outcome==="accepted")installBanner.classList.remove("show");deferredPrompt=null});
dismissInstall.addEventListener("click",()=>installBanner.classList.remove("show"));

startCamera();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)startCamera()});
</script>
</body>
</html>
